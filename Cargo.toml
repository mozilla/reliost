[package]
name = "reliost"
version = "0.2.5"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/mstange/reliost/"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "src/lib.rs"

[dependencies]
actix-cors = "0.7"
actix-web = "4"
bytes = "1.11.1"
config = "0.15"
flate2 = { version = "=1.1.2", default-features = false, features = ["zlib-rs"] }
humantime-serde = "1.1.1"
memmap2 = "0.9.9"
parse-size = "1.1.0"
proguard = "5.10.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
samply-quota-manager = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.16", features = ["io", "io-util"] }
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-bunyan-formatter = "0.3"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
# wholesym = { path = "../samply/wholesym", features = ["api"] }
wholesym = { git = "https://github.com/mstange/samply", rev = "11001b418a92b0a2a3c8d3957a6a7548c01d9d13", features = ["api"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "gzip"] }
serde_json = "1"

[profile.release]
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
debug = 2

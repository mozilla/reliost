# Servers from which we can download Breakpad .sym files
[symbols.breakpad]
servers = [
  "https://symbols.mozilla.org/try"
]
cache_dir = "./cache/symbols/breakpad/"
symindex_dir = "./cache/symbols/breakpad-symindex/"
negative_cache_ttl = "30s"

# Servers from which we can download Windows .pdb, .exe and .dll files
[symbols.windows]
servers = [
  "https://symbols.mozilla.org/try",
  "https://msdl.microsoft.com/download/symbols"
]
cache_dir = "./cache/symbols/windows/"

# Servers from which we can download Android R8/ProGuard mapping.txt files.
# Files are requested from <server>/<proguard uuid>/mapping.txt.zst, with the
# UUID written in lowercase with dashes. The files must be zstd-compressed.
# scripts/extract-aab-mapping.py creates them from an .aab file.
[proguard]
servers = []
cache_dir = "./cache/symbols/proguard/"

# Settings for automatic file deletion
[quota]
managed_dir = "./cache/symbols"
db_path = "./cache/symbols.db"
